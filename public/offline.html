<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bạn đang ở chế độ ngoại tuyến - Ký Ức Lịch Sử</title>
  <style>
    body {
      font-family: 'Merriweather', Georgia, serif;
      background-color: #FAF7F2;
      color: #2C241E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #E7D5BA;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .star {
      width: 48px;
      height: 48px;
      background: #991B1B;
      color: #FCD34D;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #7F1D1D;
    }
    p {
      font-size: 14px;
      color: #7B5B37;
      line-height: 1.6;
      font-family: system-ui, sans-serif;
    }
    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 24px;
      background: #991B1B;
      color: #FAF5ED;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="star">★</div>
    <h1>Không có kết nối mạng</h1>
    <p>
      Bạn đang ở chế độ ngoại tuyến (Offline). Các câu chuyện bạn đã xem trước đó vẫn được lưu trong bộ nhớ máy. Vui lòng kiểm tra lại kết nối mạng để tải thêm câu chuyện mới.
    </p>
    <a href="./" class="btn">Thử tải lại trang</a>
  </div>
</body>
</html>
